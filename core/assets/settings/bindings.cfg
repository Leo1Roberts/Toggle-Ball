Quit=SHIFT+ESCAPE
Fullscreen=F11

Copy=CTRL+C
Delete=DELETE
Cut=CTRL+X
Paste=CTRL+V
Duplicate=CTRL+D

Test/edit level=CTRL+TAB
Cycle tool mode=TAB
Transform mode=CTRL+1
Shape mode=CTRL+2

Toggle=SPACE
Instant toggle=CTRL+SPACE

Undo=CTRL+Z
Redo=CTRL+Y

Select all=CTRL+A
Deselect all=CTRL+SHIFT+A

Translate=T
Rotate=R
Scale=S

Constrain to X axis=X
Constrain to Y axis=Y

Toggle transform both states=B
Toggle transform individually=G
Toggle align with tangent=A